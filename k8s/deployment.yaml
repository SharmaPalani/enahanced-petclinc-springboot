apiVersion: apps/v1
kind: Deployment
metadata:
  name: enhanced-petclinic
  labels:
    app: enhanced-petclinic
spec:
  replicas: 3
  selector:
    matchLabels:
      app: enhanced-petclinic
  template:
    metadata:
      labels:
        app: enhanced-petclinic
    spec:
      containers:
        - name: enhanced-petclinic
          image: azurejenkins.azurecr.io/jenkins-project-pet:__IMAGE_TAG__
          ports:
            - containerPort: 8080
      imagePullSecrets:
        - name: acr-aks

---
apiVersion: v1
kind: Service
metadata:
  name: enhanced-petclinic-svc
  labels:
    app: enhanced-petclinic
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8080
  selector:
    app: enhanced-petclinic


